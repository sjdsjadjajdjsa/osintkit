[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "osintkit"
version = "0.1.0"
description = "Public-data OSINT aggregator for emails, usernames, domains, and companies"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "osintkit contributors" }]
keywords = ["osint", "privacy", "security", "cli", "recon"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "dnspython>=2.6",
    "python-whois>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
osintkit = "osintkit.cli:app"

[project.urls]
Homepage = "https://github.com/sjdsjadjajdjsa/osintkit"
Issues = "https://github.com/sjdsjadjajdjsa/osintkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/osintkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 112
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF", "BLE", "PYI"]
ignore = ["B008", "BLE001"]
