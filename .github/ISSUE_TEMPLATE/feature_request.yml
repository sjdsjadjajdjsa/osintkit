name: Feature request
description: A source, output, or behaviour worth adding
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is awkward today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: If this is a data source, link it and confirm it needs no login
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: The source is public and login-free
        - label: The output can be represented in the existing JSON schema
        - label: I am willing to open a PR
