name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      - name: Build
        run: |
          uv python install 3.12
          uv venv --python 3.12
          uv sync --frozen
          uv pip install build
          .venv/bin/python -m build --outdir dist
      - name: Verify the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(.venv/bin/python -c 'import osintkit; print(osintkit.__version__)')"
          test "$tag" = "$version" || { echo "tag $tag != version $version"; exit 1; }
      - name: Checksums
        run: |
          cd dist
          sha256sum osintkit-*.whl osintkit-*.tar.gz > SHA256SUMS.txt
      - uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          files: |
            dist/*
          generate_release_notes: true
      - name: Trigger PyPI publish
        if: vars.PUBLISH_TO_PYPI == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY"
