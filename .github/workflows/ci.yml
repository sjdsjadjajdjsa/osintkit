name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv sync --frozen --extra dev
      - name: Lint
        run: |
          uvx ruff check src tests
          uvx ruff format --check src tests
      - name: Test
        run: uv run --frozen pytest -q --cov=osintkit --cov-fail-under=85
